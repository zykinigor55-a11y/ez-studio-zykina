name: Verify ZYKINA ART FTPS connection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-mchost-ftps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check FTPS configuration and read-only access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and probe dedicated FTPS access (no uploads)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.MCHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.MCHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.MCHOST_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ vars.MCHOST_FTP_DIRECTORY }}
        run: |
          set -euo pipefail
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_DIRECTORY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing ${key}"
              exit 1
            fi
          done
          [[ "$FTP_USERNAME" == "p680986_deploy" ]] || { echo "::error::Unexpected FTP username"; exit 1; }
          [[ "$FTP_DIRECTORY" == "./" ]] || { echo "::error::Unexpected FTP directory"; exit 1; }
          echo "Testing read-only SFTP on port 22 instead of expired FTPS..."
          python3 -m venv /tmp/mchost-sftp
          /tmp/mchost-sftp/bin/pip install --quiet --disable-pip-version-check paramiko
          /tmp/mchost-sftp/bin/python - <<'PY'
          import os, base64, hashlib
          import paramiko
          host=os.environ["FTP_SERVER"]
          username=os.environ["FTP_USERNAME"]
          password=os.environ["FTP_PASSWORD"]
          transport=paramiko.Transport((host,22))
          try:
              transport.start_client(timeout=20)
              key=transport.get_remote_server_key()
              fingerprint=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip("=")
              print("SSH host key type:", key.get_name())
              print("SSH host public key fingerprint: SHA256:"+fingerprint)
              transport.auth_password(username,password)
              sftp=paramiko.SFTPClient.from_transport(transport)
              sftp.listdir(".")
              print("SFTP read-only directory access: OK")
              sftp.close()
          finally:
              transport.close()
          PY

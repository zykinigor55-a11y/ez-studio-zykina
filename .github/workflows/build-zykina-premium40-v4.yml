name: ZYKINA ART - Layered Premium 40s V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zykina-premium40-v4.yml'
      - 'marketing/videos/zykina-art/build_premium40_v4.py'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install premium render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q Pillow numpy opencv-python-headless
      - name: Build 7-frame storyboard from authentic painting and gallery interiors
        run: |
          mkdir -p /tmp/zykina-v4
          python marketing/videos/zykina-art/build_premium40_v4.py --assets public/assets --preview /tmp/zykina-v4/ZYKINA_ART_V4_review.jpg
      - name: Render jitter-free 40-second silent master from real artwork and macro photographs
        run: |
          python marketing/videos/zykina-art/build_premium40_v4.py --assets public/assets --out /tmp/zykina-v4/ZYKINA_ART_40s_Premium_V4_silent.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/zykina-v4/ZYKINA_ART_40s_Premium_V4_silent.mp4
      - name: Export video and art-directed preview
        uses: actions/upload-artifact@v4
        with:
          name: ZYKINA-ART-Premium-40s-V4
          path: |
            /tmp/zykina-v4/ZYKINA_ART_40s_Premium_V4_silent.mp4
            /tmp/zykina-v4/ZYKINA_ART_V4_review.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

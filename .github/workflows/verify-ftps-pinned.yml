name: Verify MCHost FTP endpoint names
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ftps-pinned.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare official MCHost FTP aliases without authentication or uploads
        shell: bash
        run: |
          set -uo pipefail
          for HOST in a458334.ftp.mchost.ru p680986.ftp.mchost.ru p680986.ispmgr.mchost.ru; do
            echo "== $HOST =="
            getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u | head -n 5 || true
            echo | timeout 8 openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" 2>/dev/null | openssl x509 -noout -subject -dates -ext subjectAltName || true
          done
